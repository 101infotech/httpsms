server {
  listen 3000;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html index.htm;

  # The container sits behind Dokploy/Cloudflare on HTTPS. Never build
  # absolute redirects from the internal host/port (they leaked
  # http://...:3000/ to browsers).
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Hashed build assets never change, so cache them for a year.
  location /_nuxt/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    # Serve /route/index.html directly (nuxt generate output) instead of
    # redirecting /route to /route/, then fall back to the SPA shell.
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control "no-cache";
  }
}
